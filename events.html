  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(https?:\/\/[^\s<>"'）)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/@@CODE(\d+)@@/g,function(m,i){return '<code>'+codes[+i]+'</code>';});
  return s;
}
function mdToHtml(md){
  var lines=String(md).split('\n'), out=[], i=0, para=[];
  function flushPara(){ if(para.length){ out.push('<p>'+inlineMd(para.join(' '))+'</p>'); para=[]; } }
  function isTableSep(l){ return /^\s*\|?[\s:|\-]+\|[\s:|\-]*$/.test(l) && l.indexOf('-')>=0; }
  function cells(r){ return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return inlineMd(c.trim());}); }
  while(i<lines.length){
    var line=lines[i];
    if(/^\s*$/.test(line)){ flushPara(); i++; continue; }
    var hm=line.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ flushPara(); var lv=hm[1].length; out.push('<h'+(lv+1)+'>'+inlineMd(hm[2])+'</h'+(lv+1)+'>'); i++; continue; }
    if(/^---+$/.test(line.trim())){ flushPara(); out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(line)){
      flushPara();
      var q=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'); continue;
    }
    if(/^\s*\|/.test(line) && i+1<lines.length && isTableSep(lines[i+1])){
      flushPara();
      var rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var head=cells(rows[0]);
      out.push('<div class="tbl"><table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
        rows.slice(2).map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>');
      continue;
    }
    var um=line.match(/^\s*[-*]\s+(.*)$/);
    if(um){
      flushPara();
      var items=[]; while(i<lines.length){ var m2=lines[i].match(/^\s*[-*]\s+(.*)$/); if(!m2) break; items.push(m2[1]); i++; }
      out.push('<ul>'+items.map(function(t){return '<li>'+inlineMd(t)+'</li>';}).join('')+'</ul>'); continue;
    }
    var om=line.match(/^\s*\d+[.、]\s+(.*)$/);
    if(om){
      flushPara();
      var items2=[]; while(i<lines.length){ var m3=lines[i].match(/^\s*\d+[.、]\s+(.*)$/); if(!m3) break; items2.push(m3[1]); i++; }
      out.push('<ol>'+items2.map(function(t){return '<li>'+inlineMd(t)+'</li>';}).join('')+'</ol>'); continue;
    }
    para.push(line.trim()); i++;
  }
  flushPara();
  return out.join('\n');
}
function renderDetail(md){
  var parts=String(md).split(/^## /m);
  var html='';
  var intro=parts[0].trim();
  if(intro){ html+='<div class="detail-sec">'+mdToHtml(intro)+'</div>'; }
  for(var k=1;k<parts.length;k++){
    var chunk=parts[k];
    var nl=chunk.indexOf('\n');
    var title=nl>=0?chunk.slice(0,nl).trim():chunk.trim();
    var body=nl>=0?chunk.slice(nl+1):'';
    html+='<div class="detail-sec"><h2>'+esc(title)+'</h2>'+mdToHtml(body)+'</div>';
  }
  return html;
}

let IDX = EMBEDDED;
function render(d){
  const rows = (d && d.rows) || [];
  if(!rows.length){ document.getElementById('today').textContent = '暂无数据。'; return; }
  const ev = [...rows].reverse().find(r=>r.events);
  let t = '';
  if(ev){
    t += '<p><b>' + esc(ev.date) + ' · ' + esc(ev.events.main || '') + '</b></p>';
    if((ev.events.domestic||[]).length) t += '<p>🇨🇳 国内：' + esc(ev.events.domestic.join('；')) + '</p>';
    if((ev.events.international||[]).length) t += '<p>🌐 国际：' + esc(ev.events.international.join('；')) + '</p>';
  }
  document.getElementById('today').innerHTML = t || '暂无大事，明天 07:30 首推。';
  const erows = rows.filter(r=>r.events);
  document.getElementById('recent').innerHTML = [...erows].reverse().slice(0,10).map(r=>'<p><b>' + esc(r.date) + '</b> ' + esc(r.events.main || '') + '</p>').join('') || '<p class="muted">暂无。</p>';
  const cal = document.getElementById('calendar');
  cal.innerHTML = erows.map(r=>'<button class="daybtn" data-date="' + r.date + '">' + r.date.slice(5) + '</button>').join('');
  cal.querySelectorAll('.daybtn').forEach(b=>b.addEventListener('click',()=>loadDate(b.dataset.date)));
  const q = document.getElementById('q');
  if(q && !q.dataset.bound){ q.dataset.bound = '1'; q.addEventListener('input', e=>search(e.target.value.trim())); }
  const res = document.getElementById('results');
  if(res && !res.dataset.bound){
    res.dataset.bound = '1';
    res.addEventListener('click', e=>{
      const b = e.target.closest('[data-date]');
      if(b) loadDate(b.dataset.date);
    });
  }
}
function search(q){
  const box = document.getElementById('results');
  if(!q){ box.innerHTML = ''; return; }
  const needle = q.toLowerCase();
  const hits = IDX.rows.filter(r=>r.events && (r.date + ' ' + (r.events.main||'') + ' ' + (r.events.domestic||[]).join(' ') + ' ' + (r.events.international||[]).join(' ')).toLowerCase().includes(needle)).reverse().slice(0, 20);
  if(!hits.length){ box.innerHTML = '<p class="muted">大事摘要里没找到“' + esc(q) + '”。只搜摘要，不翻全文；想查全文里的词，点日期打开当天全文再用浏览器查找（Ctrl+F）。</p>'; return; }
  box.innerHTML = hits.map(r=>'<p><button class="daybtn" data-date="' + r.date + '">' + esc(r.date) + '</button> ' + esc(r.events.main || '').slice(0,60) + '…</p>').join('');
}
async function loadDate(date){
  document.querySelectorAll('.daybtn').forEach(b=>b.classList.toggle('sel', b.dataset.date === date));
  const box = document.getElementById('detail');
  box.innerHTML = '<h3>' + esc(date) + ' 大事早报</h3><p class="muted">正在加载当天全文…</p>';
  let text = null;
  try{ const r = await fetch('archive/events/' + date + '.md'); if(r.ok) text = await r.text(); }catch(e){}
  if(!text){ box.innerHTML = '<h3>' + esc(date) + ' 大事早报</h3><p class="muted">当天无大事早报。</p>'; return; }
  box.innerHTML = '<h3>' + esc(date) + ' 大事早报</h3>' + renderDetail(text);
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
render(IDX);
fetch('data/index.json').then(r=>r.json()).then(d=>{
  if(d && d.rows && JSON.stringify(d) !== JSON.stringify(IDX)){ IDX = d; render(d); }
}).catch(()=>{});
</script>
